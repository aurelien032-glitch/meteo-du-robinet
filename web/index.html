<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%A7%3C/text%3E%3C/svg%3E" />
    <meta name="description" content="Qualité de l'eau du robinet, prix et fuites des services d'eau, commune par commune, à partir des données publiques françaises." />
    <link rel="preload" href="/fonts/atkinson/next.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      /* Thème choisi par le visiteur, appliqué avant le premier affichage ; sans choix, la feuille de style
         suit le réglage du système (lib/theme.ts, useTheme). */
      try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}
    </script>
    <title>Météo du robinet · l'eau potable en France, de la ressource au robinet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
