name: Signaler une erreur
description: Une donnée, une carte ou un classement qui semble faux, ou un problème sur le site.
title: "Erreur : "
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler une erreur. Ce ticket est **public** : n'y mettez pas d'information personnelle.
  - type: input
    id: lien
    attributes:
      label: Page concernée
      description: Collez l'adresse de la page du site.
      placeholder: https://meteodurobinet.fr/…
    validations:
      required: true
  - type: dropdown
    id: nature
    attributes:
      label: Nature du problème
      options:
        - Une donnée ou une note (qualité, avis sanitaire, prix, prélèvements)
        - Une commune ou un réseau mal rattaché
        - La carte (contours, couleurs, affichage)
        - Le site (lien, bouton, lenteur, accessibilité)
        - Autre
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Ce qui ne va pas
      description: Ce que vous voyez, et ce que vous attendiez.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source officielle (facultatif)
      description: Le lien d'une donnée officielle qui montre l'écart, s'il y en a un.
  - type: input
    id: appareil
    attributes:
      label: Appareil et navigateur (facultatif)
      placeholder: ex. iPhone et Safari, ordinateur et Firefox
