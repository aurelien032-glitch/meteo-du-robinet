[project]
name = "robinet-pipeline"
version = "0.1.0"
description = "Pipeline de données eau potable (SISE-Eaux, SISPEA, BNPE, BNV-D, VigiEau)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.3",
  "pyarrow>=19",
  "requests>=2.32",
  "py7zr>=0.22",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pandas>=2.2",
  "typer>=0.15",
]

[project.scripts]
robinet = "robinet.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robinet"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
